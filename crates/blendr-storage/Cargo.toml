[package]
name = "blendr-storage"
version = "0.1.0"
edition = "2024"
description = "Blendr local-first persistence: bundled SQLite schema, migrations, relay queue, local messages"
license = "MIT"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
