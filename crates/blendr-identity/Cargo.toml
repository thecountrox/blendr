[package]
name = "blendr-identity"
version = "0.1.0"
edition = "2024"
description = "Blendr Identity System (BIS): Ed25519 BID, signed identity documents, and the encrypted keystore"
license = "MIT"

[dependencies]
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
data-encoding = "2"
ed25519-dalek = "3"
getrandom = "0.4"
minicbor = { version = "2.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
