[package]
name = "blendr-cli"
version = "0.1.0"
edition = "2024"
description = "Blendr local-first BLE messaging: Linux command-line interface"
license = "MIT OR Apache-2.0"

[dependencies]
blendr-config = { path = "../../crates/blendr-config" }
clap = { version = "4", features = ["derive"] }
blendr-identity = { path = "../../crates/blendr-identity" }
blendr-storage = { path = "../../crates/blendr-storage" }
blendr-messaging = { path = "../../crates/blendr-messaging" }
blendr-protocol = { path = "../../crates/blendr-protocol" }
blendr-transport = { path = "../../crates/blendr-transport" }
blendr-bluez = { path = "../../crates/blendr-bluez" }
tokio = { version = "1", features = ["rt", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
env_logger = { version = "0.11", default-features = false }
rpassword = "7"
zeroize = "1"
serde_json = "1"
uuid = "1"

[[bin]]
name = "blendr"
path = "src/main.rs"
